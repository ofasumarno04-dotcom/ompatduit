
name: Build ompatduit APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

      - name: Accept Android licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android packages
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip ompatduit_Android_Project_HP.zip -d unpacked

      - name: Build APK
        run: |
          cd unpacked/oMpat_Finance_Android_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ompatduit-APK
          path: unpacked/oMpat_Finance_Android_Project/app/build/outputs/apk/debug/app-debug.apk
